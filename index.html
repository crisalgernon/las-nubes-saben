<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Las Nubes Saben™</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-text-dark: #000000;
            --color-text-light: #000000;
            --shadow-subtle: 0 4px 20px rgba(0,0,0,0.08);
            --border-radius-lg: 18px;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'DM Sans', sans-serif;
            display:flex; flex-direction:column;
            align-items:center; justify-content:center;
            min-height:100vh; padding:20px;
            perspective:1000px; overflow:hidden;
            background-color:#c8d8e0;
            background-image:
                radial-gradient(ellipse 55% 45% at 60% 25%, rgba(255,80,20,.92) 0%, rgba(255,120,40,.6) 40%, transparent 70%),
                radial-gradient(ellipse 35% 30% at 40% 55%, rgba(255,100,30,.85) 0%, rgba(255,140,60,.5) 45%, transparent 70%),
                radial-gradient(ellipse 25% 20% at 30% 35%, rgba(255,130,50,.70) 0%, transparent 65%),
                radial-gradient(ellipse 40% 35% at 55% 70%, rgba(230,60,10,.80) 0%, rgba(255,100,30,.4) 50%, transparent 72%),
                radial-gradient(ellipse 60% 50% at 20% 60%, rgba(160,195,210,.85) 0%, transparent 65%),
                radial-gradient(ellipse 45% 40% at 80% 75%, rgba(140,180,200,.80) 0%, transparent 65%),
                radial-gradient(ellipse 70% 60% at 50% 50%, rgba(200,220,228,.40) 0%, transparent 75%);
            background-size:180% 180%;
            animation:respirar 14s ease-in-out infinite alternate;
        }
        @keyframes respirar {
            0%  { background-position:0%  0%;  filter:brightness(1)    saturate(1); }
            25% { background-position:8%  12%; filter:brightness(1.04) saturate(1.06); }
            50% { background-position:15% 5%;  filter:brightness(1.02) saturate(1.10); }
            75% { background-position:5%  18%; filter:brightness(1.05) saturate(1.05); }
            100%{ background-position:12% 8%;  filter:brightness(1)    saturate(1); }
        }
        #canvas-flores { position:fixed; inset:0; z-index:1; pointer-events:none; }
        .card-container {
            position:relative; z-index:2;
            width:90%; max-width:600px; min-height:250px;
            transform-style:preserve-3d;
            transition:transform 1s cubic-bezier(.25,.46,.45,.94);
            cursor:pointer;
        }
        .card-container.flipped { transform:rotateY(-180deg); }
        .card {
            position:absolute; top:0; left:0; width:100%; height:100%;
            border-radius:var(--border-radius-lg);
            background:rgba(255,255,255,1);
            backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
            border:1px solid rgba(255,255,255,.45);
            box-shadow:var(--shadow-subtle);
            backface-visibility:hidden;
            padding:2.5rem 2rem;
            display:flex; flex-direction:column; gap:.5rem; justify-content:center;
        }
        .card.front { z-index:2; align-items:center; text-align:center; }
        .card.back  { transform:rotateY(180deg); z-index:1; align-items:flex-start; text-align:left; }
        .mensaje-header { display:flex; align-items:center; font-size:.9rem; font-weight:500; color:var(--color-text-light); text-transform:uppercase; letter-spacing:.5px; }
        .mensaje-header .emoji-cloud { margin-left:8px; font-size:1.2rem; animation:flotar 3s ease-in-out infinite; }
        .mensaje-principal { font-size:1.55rem; font-weight:700; line-height:1.3; color:var(--color-text-dark); margin-top:.5rem; text-align:left; }
        .mensaje-secundario { font-size:.95rem; font-weight:400; color:var(--color-text-light); margin-top:.5rem; text-align:left; }
        .title-no-spacing { line-height:1; }
        @keyframes flotar { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }
        @media(max-width:768px){
            .mensaje-principal{font-size:1.25rem}
            .mensaje-secundario{font-size:.9rem}
            .mensaje-header{font-size:.8rem}
        }
    </style>
</head>
<body>
<canvas id="canvas-flores"></canvas>
<div class="card-container" id="cardContainer">
    <div class="card front">
        <h1 class="title-no-spacing" style="font-size:2rem;">Las Nubes Saben™</h1>
    </div>
    <div class="card back">
        <div class="mensaje-header">MENSAJE DE TU NUBE <span class="emoji-cloud">☁️</span></div>
        <p class="mensaje-principal" id="mensajePrincipal"></p>
        <p class="mensaje-secundario">Si quieres otro mensaje, vuelve a acercarte a la nube.</p>
    </div>
</div>

class Elemento {
    constructor(inicial=false) { this.reset(inicial); }
    reset(inicial=false) {
        this.img    = imgs[Math.floor(Math.random() * imgs.length)];
        this.talla  = Math.random() * 200 + 60;
        this.x      = Math.random() * canvas.width;
        this.y      = inicial ? Math.random() * canvas.height : -this.talla * 2;
        this.speed  = Math.random() * 0.65 + 0.3;
        this.vx     = (Math.random() - 0.5) * 0.3;
        this.angle  = Math.random() * Math.PI * 2;
        this.spin   = (Math.random() - 0.5) * 0.016;
        this.swing  = Math.random() * Math.PI * 2;
        this.swingV = Math.random() * 0.012 + 0.006;
    }
    update() {
        this.swing += this.swingV;
        this.x += this.vx + Math.sin(this.swing) * 0.65;
        this.y += this.speed;
        this.angle += this.spin;
        if (this.y > canvas.height + this.talla * 2) this.reset();
    }
    draw() {
        if (!this.img || !this.img.complete) return;
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);
        ctx.drawImage(this.img, -this.talla/2, -this.talla/2, this.talla, this.talla);
        ctx.restore();
    }
}

const elementos = Array.from({length:18}, () => new Elemento(true));
const animar = () => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    elementos.forEach(e => { e.update(); e.draw(); });
    requestAnimationFrame(animar);
};
